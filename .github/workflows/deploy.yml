name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Daily rebuild so the GitHub activity tile stays fresh.
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'mickeiik/mickeiik.github.io'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
        env:
          # Reads the public contribution calendar for the homepage GitHub tile.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Live data Worker for the music tile (repository variable). Unset hides the tile.
          LIVE_API_URL: ${{ vars.LIVE_API_URL }}
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
